version: 2.1
jobs:
  build:
    docker:
      - image: eclipse-temurin:27-jdk  # Same image as springboot-bankzy-parent
    working_directory: ~/repo

    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "pom.xml" }}
            - v1-dependencies-
      # Only main publishes to PackageCloud; other branches just build
      - when:
          condition:
            equal: [ main, << pipeline.git.branch >> ]
          steps:
            - run: ./mvnw clean deploy -Ppackagecloud -s .circleci/settings.xml
      - unless:
          condition:
            equal: [ main, << pipeline.git.branch >> ]
          steps:
            - run: ./mvnw clean verify -s .circleci/settings.xml
      - save_cache:
          paths:
            - ~/.m2
          key: v1-dependencies-{{ checksum "pom.xml" }}
workflows:
  main:
    jobs:
      - build:
          filters:
            branches:
              only: main
